bind 0.0.0.0
# Docker queue network is internal-only; access control is mandatory mTLS.
# Valkey protected mode would otherwise reject all non-loopback clients when no password is set.
protected-mode no
port 0
tls-port 6379
tls-cert-file /run/valkey-pki/server.crt
tls-key-file /run/valkey-pki/server.key
tls-ca-cert-file /run/valkey-pki/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.2 TLSv1.3"
appendonly yes
appendfsync everysec
dir /data
save ""
