apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: qc-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qc-api
spec:
  # Keep the direct manifest aligned with Helm: one SQLite writer until #72
  # externalizes authoritative runtime state to a concurrency-safe datastore.
  replicas: 1
  selector:
    matchLabels:
      app: qc-api
  template:
    metadata:
      labels:
        app: qc-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/queencalifia-api:TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: qc-config
            - secretRef:
                name: qc-secrets
          # API-only state destinations. The Celery worker must not share this
          # SQLite PVC across pods; distributed scan results live in Redis.
          env:
            - name: QC_DB_PATH
              value: /var/data/queen.db
            - name: QC_EVOLUTION_DB
              value: /var/data/qc_evolution.db
            - name: QC_MEMORY_BACKUP_DIR
              value: /var/data/memory-backups
            - name: QC_THREAT_INTEL_DB
              value: /var/data/qc_threat_intel.db
            - name: QC_API_KEYS_FILE
              value: /var/data/keys.json
            - name: QC_AUDIT_LOG_FILE
              value: /var/data/audit.log.jsonl
            - name: QC_AUDIT_CHAIN_DB
              value: /var/data/queen.db
            - name: QC_APPROVALS_DB
              value: /var/data/queen.db
            - name: QC_SPKI_LOG_FILE
              value: /var/data/spki.jsonl
          volumeMounts:
            - name: api-state
              mountPath: /var/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: api-state
          persistentVolumeClaim:
            claimName: qc-api-state
