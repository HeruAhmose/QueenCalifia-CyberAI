{{- if or (gt (int .Values.api.replicaCount) 1) .Values.api.autoscaling.enabled }}
{{- fail "Queen Califia API multi-replica/autoscaling is unsupported while authoritative runtime state is local SQLite/file-backed. Keep api.replicaCount=1 and api.autoscaling.enabled=false until issue #72 externalizes state." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qc-api
  namespace: {{ include "queen-califia.ns" . }}
  labels:
{{ include "queen-califia.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: qc-api
      {{- include "queen-califia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: qc-api
        {{- include "queen-califia.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- $psc := default .Values.podSecurityContext .Values.api.podSecurityContext -}}
      {{- with $psc }}
      securityContext:
{{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "queen-califia.image" (dict "img" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- $csc := default .Values.containerSecurityContext .Values.api.containerSecurityContext -}}
          {{- with $csc }}
          securityContext:
{{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
              name: http
          envFrom:
            {{- if .Values.config.create }}
            - configMapRef:
                name: {{ .Values.config.name }}
            {{- end }}
            - secretRef:
                name: {{ .Values.secrets.name }}
          # Single-writer persistence contract while #72 remains open. These
          # values are deliberately scoped to the API container so the Celery
          # worker never shares the SQLite volume across pods.
          env:
            - name: QC_DB_PATH
              value: /var/data/queen.db
            - name: QC_EVOLUTION_DB
              value: /var/data/qc_evolution.db
            - name: QC_MEMORY_BACKUP_DIR
              value: /var/data/memory-backups
            - name: QC_THREAT_INTEL_DB
              value: /var/data/qc_threat_intel.db
            - name: QC_API_KEYS_FILE
              value: /var/data/keys.json
            - name: QC_AUDIT_LOG_FILE
              value: /var/data/audit.log.jsonl
            - name: QC_AUDIT_CHAIN_DB
              value: /var/data/queen.db
            - name: QC_APPROVALS_DB
              value: /var/data/queen.db
            - name: QC_SPKI_LOG_FILE
              value: /var/data/spki.jsonl
          volumeMounts:
            - name: api-state
              mountPath: /var/data
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readinessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
      volumes:
        - name: api-state
          persistentVolumeClaim:
            claimName: qc-api-state
