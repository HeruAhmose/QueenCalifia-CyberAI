name: release-helm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the Helm chart"
        required: true
        default: "oci"
        type: choice
        options:
          - oci
          - pages
          - both

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OCI_CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/queencalifia-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/queencalifia-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Derive and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.API_IMAGE }}:latest

      - name: Build + push Frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest

  version-sync:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Sync chart + values versions
        shell: bash
        env:
          QC_RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release/sync_versions.sh "$QC_RELEASE_VERSION"

      - name: Create PR for version sync (protected-branch safe)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: chore/release-sync-v${{ needs.build-and-push.outputs.version }}
          delete-branch: true
          title: "chore(release): sync chart/app versions to v${{ needs.build-and-push.outputs.version }}"
          commit-message: "chore(release): sync chart/app versions to v${{ needs.build-and-push.outputs.version }}"
          body: |
            Automated sync after tagging v${{ needs.build-and-push.outputs.version }}.

            Updates:
            - helm/queen-califia/Chart.yaml (version + appVersion)
            - helm/queen-califia/values.yaml (default image tags)
          add-paths: |
            helm/queen-califia/Chart.yaml
            helm/queen-califia/values.yaml

  chart-package:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    outputs:
      chart_version: ${{ needs.build-and-push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.14.4

      - name: Package Helm chart
        shell: bash
        env:
          QC_RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm lint ./helm/queen-califia
          helm package ./helm/queen-califia --destination dist --version "$QC_RELEASE_VERSION" --app-version "$QC_RELEASE_VERSION"
          ls -lah dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: helm-chart
          path: dist/*.tgz

  publish-oci:
    runs-on: ubuntu-latest
    needs: [build-and-push, chart-package]
    if: |
      github.ref_type == 'tag' && (github.event_name == 'push' || github.event.inputs.publish == 'oci' || github.event.inputs.publish == 'both')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.14.4

      - name: Download chart artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: helm-chart
          path: dist

      - name: Login Helm registry (OCI)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | helm registry login "$REGISTRY" -u "$GHCR_ACTOR" --password-stdin

      - name: Push chart to OCI
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=(dist/*.tgz)
          if ((${#charts[@]} == 0)); then
            echo "No chart package found under dist/" >&2
            exit 1
          fi
          CHART="${charts[0]}"
          helm push "$CHART" "oci://$OCI_CHART_REPO"

  publish-pages:
    runs-on: ubuntu-latest
    needs: [build-and-push, chart-package]
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.publish == 'pages' || github.event.inputs.publish == 'both')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.14.4

      - name: Run chart-releaser (GH Pages)
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584
        with:
          charts_dir: helm
          pages_branch: gh-pages
          packages_with_index: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
