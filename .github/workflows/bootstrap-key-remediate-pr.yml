name: bootstrap-key-remediate-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate-and-verify:
    if: github.head_ref == 'agent/redact-bootstrap-api-keys-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic remediation
        run: python scripts/security/remediate_bootstrap_key_logging.py

      - name: Verify security behavior and full repository suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m compileall -q api backend core tests
          python -m pytest -q tests/test_api_key_bootstrap_secrets.py
          python -m pytest -q

      - name: Prove raw bootstrap values are not logged
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('api/gateway.py').read_text(encoding='utf-8')
          forbidden = [
              'ADMIN  = %s',
              'ANALYST= %s',
              'READER = %s',
              'Bootstrapped API keys (store securely; rotate immediately):',
          ]
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'Forbidden raw-key logging strings remain: {present}')
          PY

      - name: Commit verified remediation to PR head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/gateway.py tests/test_api_key_bootstrap_secrets.py .gitignore
          if git diff --cached --quiet; then
            echo 'Remediation already applied.'
            exit 0
          fi
          git commit -m 'fix(security): stop logging bootstrap API keys'
          git push origin HEAD:${{ github.head_ref }}
