name: Verify QC maintenance repair

on:
  push:
    branches:
      - fix/maintenance-workflows-20260909

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/maintenance-workflows-20260909
          fetch-depth: 0

      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          HELM_VERSION="$(grep '^HELM_VERSION=' scripts/bootstrap/versions.env | cut -d= -f2-)"
          KUBECTL_VERSION="$(grep '^KUBECTL_VERSION=' scripts/bootstrap/versions.env | cut -d= -f2-)"
          test -n "$HELM_VERSION"
          test -n "$KUBECTL_VERSION"
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"
          echo "kubectl=$KUBECTL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Install jq
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null

      - name: Apply maintenance repair
        shell: python
        run: |
          from pathlib import Path

          makefile = Path("Makefile")
          text = makefile.read_text(encoding="utf-8")
          help_lines = (
              '\t@echo "  make lock          - generate requirements.lock + requirements-dev.lock with hashes (Docker required)"\n'
              '\t@echo "  make lock-upgrade  - same as lock, but upgrades within constraints"\n'
          )
          if text.count(help_lines) != 1:
              raise SystemExit("unexpected Makefile lock help shape")
          text = text.replace(help_lines, "")
          lock_targets = (
              "\nlock:\n"
              "\t@./scripts/lock.sh\n\n"
              "lock-upgrade:\n"
              "\t@QC_LOCK_UPGRADE=1 ./scripts/lock.sh\n"
          )
          if text.count(lock_targets) != 1:
              raise SystemExit("unexpected Makefile lock target shape")
          text = text.replace(lock_targets, "\n")

          broken = "\n" + r"\1" + "\n.PHONY: kind-ingress-e2e\n"
          fixed = "\n.PHONY: kind-ingress-e2e\n"
          if text.count(broken) != 1:
              raise SystemExit("unexpected Makefile corruption shape")
          text = text.replace(broken, fixed)
          makefile.write_text(text, encoding="utf-8")

          bootstrap = Path("scripts/bootstrap/bootstrap_cluster.sh")
          text = bootstrap.read_text(encoding="utf-8")
          old = "kubectl -n argocd-image-updater rollout status deploy/argocd-image-updater --timeout=10m"
          new = "kubectl -n argocd-image-updater rollout status deployment -l app.kubernetes.io/instance=argocd-image-updater --timeout=10m"
          if text.count(old) != 1:
              raise SystemExit("unexpected Image Updater readiness check shape")
          bootstrap.write_text(text.replace(old, new), encoding="utf-8")

          windows = Path("scripts/dev/python_bootstrap_windows.ps1")
          text = windows.read_text(encoding="utf-8")
          text = text.replace(
              "  - Installs requirements.txt and (optionally) requirements-dev.txt.\n",
              "  - Installs backend/requirements.txt and, with -Dev, bootstrap requirements plus pytest.\n",
          )
          old = '''  if (Test-Path "requirements.txt") {
            Write-Info "installing requirements.txt"
            Exec $venvPy @("-m","pip","install","-r","requirements.txt")
          } else {
            Write-Warn "requirements.txt not found; skipping"
          }

          if ($Dev) {
            if (Test-Path "requirements-dev.txt") {
              Write-Info "installing requirements-dev.txt"
              Exec $venvPy @("-m","pip","install","-r","requirements-dev.txt")
            } elseif (Test-Path "requirements-dev.lock") {
              Write-Info "installing requirements-dev.lock"
              Exec $venvPy @("-m","pip","install","-r","requirements-dev.lock")
            } else {
              Write-Warn "no dev requirements file found; skipping"
            }
          }
'''
          new = '''  $backendReq = Join-Path $root "backend\\requirements.txt"
          if (-not (Test-Path $backendReq)) { throw "backend requirements not found: $backendReq" }
          Write-Info "installing backend/requirements.txt"
          Exec $venvPy @("-m","pip","install","-r",$backendReq)

          if ($Dev) {
            $bootstrapReq = Join-Path $root "scripts\\bootstrap\\requirements.txt"
            if (-not (Test-Path $bootstrapReq)) { throw "bootstrap requirements not found: $bootstrapReq" }
            Write-Info "installing bootstrap requirements and pytest"
            Exec $venvPy @("-m","pip","install","-r",$bootstrapReq,"pytest")
          }
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected Windows dependency block shape")
          windows.write_text(text.replace(old, new), encoding="utf-8")

          for obsolete in (
              Path(".github/workflows/deps-refresh.yml"),
              Path("scripts/lock.sh"),
          ):
              if not obsolete.exists():
                  raise SystemExit(f"expected obsolete path missing: {obsolete}")
              obsolete.unlink()

      - name: Validate static maintenance contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap/bootstrap_cluster.sh
          make help > /tmp/qc-make-help.txt
          if grep -q 'make lock' /tmp/qc-make-help.txt; then
            echo "retired lock target is still advertised" >&2
            exit 1
          fi
          if grep -R -n --exclude='Dockerfile' --exclude='verify-maintenance-repair.yml' 'scripts/lock.sh\|requirements-dev.lock\|requirements-dev.txt' Makefile .github scripts; then
            echo "retired root dependency references remain" >&2
            exit 1
          fi
          if grep -Fn '\1' Makefile; then
            echo "malformed Makefile escape remains" >&2
            exit 1
          fi
          grep -q 'working-directory: backend' .github/workflows/dependency-audit.yml
          grep -q 'pip-audit -r requirements.txt' .github/workflows/dependency-audit.yml
          grep -q 'COPY backend/requirements.txt' Dockerfile
          grep -q 'COPY backend/requirements.txt' backend/Dockerfile
          grep -q 'backend\\requirements.txt' scripts/dev/python_bootstrap_windows.ps1
          grep -q 'scripts\\bootstrap\\requirements.txt' scripts/dev/python_bootstrap_windows.ps1
          grep -q '"pytest"' scripts/dev/python_bootstrap_windows.ps1

      - name: Validate Windows bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/dev/python_bootstrap_windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Bump chart versions exactly as scheduled maintenance does
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap/bump_versions.sh
          scripts/bootstrap/bump_versions.sh scripts/bootstrap/versions.env

      - name: Create Kind cluster
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab
        with:
          cluster_name: qc-maintenance-repair
          kubectl_version: ${{ steps.versions.outputs.kubectl }}
          version: v0.30.0
          wait: 60s

      - name: Execute upgraded bootstrap contract
        shell: bash
        env:
          QC_GIT_ORG: dummy
          QC_GIT_REPO: QueenCalifia-CyberAI
          QC_API_IMAGE: ghcr.io/dummy/queencalifia-api
          QC_FRONTEND_IMAGE: ghcr.io/dummy/queencalifia-frontend
          QC_STAGING_HOST: staging.local
          QC_PROD_HOST: prod.local
          QC_EMAIL: devnull@example.com
          QC_INSTALL_CLUSTER_ISSUERS: "0"
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap/bootstrap_cluster.sh
          scripts/bootstrap/bootstrap_cluster.sh

      - name: Restore validation-only version mutations
        shell: bash
        run: |
          set -euo pipefail
          git restore scripts/bootstrap/bump_versions.sh scripts/bootstrap/versions.env
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Makefile scripts/bootstrap/bootstrap_cluster.sh scripts/dev/python_bootstrap_windows.ps1 .github/workflows/deps-refresh.yml scripts/lock.sh
          git diff --cached --check
          git commit -m "fix(maintenance): repair scheduled QC workflows"
          git push origin HEAD:fix/maintenance-workflows-20260909
