name: QC Public 3f305b0 Probe

on:
  push:
    branches: [probe/qc-public-3f305b0-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Certify exact current public presentation
        shell: bash
        env:
          EXPECTED_SHA: 3f305b005e8e9c52c229250ee0238626647d3640
          BASE_URL: https://heruahmose.github.io/QueenCalifia-CyberAI/
        run: |
          set -euo pipefail
          observed=''
          for i in $(seq 1 50); do
            observed="$(curl -fsSL "${BASE_URL}deploy-commit.txt" 2>/dev/null | tr -d '\r\n' || true)"
            [ "$observed" = "$EXPECTED_SHA" ] && break
            sleep 6
          done
          echo "QC_PUBLIC_EXPECTED_SHA=$EXPECTED_SHA"
          echo "QC_PUBLIC_OBSERVED_SHA=$observed"
          test "$observed" = "$EXPECTED_SHA"

          html="$(curl -fsSL "$BASE_URL")"
          asset="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          case "$asset" in
            http://*|https://*) asset_url="$asset" ;;
            /*) asset_url="https://heruahmose.github.io${asset}" ;;
            *) asset_url="${BASE_URL}${asset#./}" ;;
          esac
          echo "QC_PUBLIC_JS_ENTRY=$asset_url"

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          timeout 70s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "$BASE_URL" > /tmp/qc-live.html
          echo "QC_PUBLIC_DOM_BYTES=$(wc -c < /tmp/qc-live.html | tr -d ' ')"
          browser_ok=1
          for marker in 'Queen Califia' 'SOVEREIGN COGNITIVE DEFENSE' 'HUMAN AUTHORITY'; do
            if grep -Fqi "$marker" /tmp/qc-live.html; then
              echo "QC_PUBLIC_MARKER_${marker// /_}=PASS"
            else
              echo "QC_PUBLIC_MARKER_${marker// /_}=MISSING"
              browser_ok=0
            fi
          done
          python3 - <<'PY'
          import html
          import re
          from pathlib import Path

          raw = Path('/tmp/qc-live.html').read_text(encoding='utf-8', errors='replace')
          title = re.search(r'<title[^>]*>(.*?)</title>', raw, flags=re.I | re.S)
          print('QC_PUBLIC_TITLE=' + (html.unescape(title.group(1)).strip() if title else ''))
          body = re.sub(r'<script\b[^>]*>.*?</script>', ' ', raw, flags=re.I | re.S)
          body = re.sub(r'<style\b[^>]*>.*?</style>', ' ', body, flags=re.I | re.S)
          body = re.sub(r'<[^>]+>', ' ', body)
          body = html.unescape(body)
          body = re.sub(r'\s+', ' ', body).strip()
          print('QC_PUBLIC_VISIBLE_TEXT=' + body[:2400])
          PY

          binding_ok=0
          if ENTRY_URL="$asset_url" python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          target = "qc.tamerian-materials.com"
          allowed_host = "heruahmose.github.io"
          allowed_path = "/QueenCalifia-CyberAI/"
          queue = [os.environ["ENTRY_URL"]]
          seen = set()
          matched = None

          while queue and len(seen) < 250:
              url = queue.pop(0)
              if url in seen:
                  continue
              parsed = urlparse(url)
              if parsed.netloc != allowed_host or not parsed.path.startswith(allowed_path):
                  continue
              seen.add(url)
              request = Request(url, headers={"User-Agent": "qc-public-cert/1.0"})
              with urlopen(request, timeout=20) as response:
                  text = response.read().decode("utf-8", errors="replace")
              if target in text:
                  matched = url
                  break
              for ref in re.findall(r"[\"']([^\"']+\.js(?:\?[^\"']*)?)[\"']", text):
                  resolved = urljoin(url, ref)
                  if resolved not in seen:
                      queue.append(resolved)

          print(f"QC_PUBLIC_JS_CHUNKS_SCANNED={len(seen)}")
          print(f"QC_PUBLIC_API_BINDING_CHUNK={matched or ''}")
          if not matched:
              sys.exit(1)
          PY
          then
            binding_ok=1
          else
            echo 'QC_PUBLIC_CANONICAL_API_BINDING=MISSING'
          fi

          test "$browser_ok" = 1
          test "$binding_ok" = 1
          echo 'QC_PUBLIC_EXACT_SHA=PASS'
          echo 'QC_PUBLIC_PRESTIGE_BROWSER=PASS'
          echo 'QC_PUBLIC_CANONICAL_API_BINDING=PASS'
