name: sovereign-edge-compat

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sovereign-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-edge-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Sovereign Edge static invariants
        run: python scripts/ci/check_sovereign_edge_deployment.py

      - name: Shell syntax
        run: |
          bash -n scripts/edge/bootstrap-ubuntu.sh
          bash -n scripts/edge/generate-valkey-mtls.sh
          bash -n scripts/edge/backup-postgres.sh
          bash -n scripts/edge/restore-postgres.sh
          bash -n scripts/edge/backup-host-state.sh
          bash -n scripts/edge/verify-runtime.sh
          bash -n scripts/edge/reboot-persistence-proof.sh
          bash -n scripts/edge/health-watchdog.sh
          bash -n scripts/edge/container-entrypoint.sh

      - name: Render compose with no host ports
        run: |
          cat >.env.edge <<EOF
          QC_EDGE_STATE_ROOT=${RUNNER_TEMP}/qc-edge
          QC_DATABASE_URL=postgresql://queen:placeholder@example-pooler.neon.tech/neondb?sslmode=require
          DATABASE_URL=postgresql://queen:placeholder@example-pooler.neon.tech/neondb?sslmode=require
          QC_DATABASE_DIRECT_URL=postgresql://queen:placeholder@example.neon.tech/neondb?sslmode=require
          CF_TUNNEL_TOKEN=ci-placeholder-not-a-real-token
          QC_API_KEY_PEPPER=ci-placeholder
          QC_AUDIT_HMAC_KEY=ci-placeholder
          QC_METRICS_TOKEN=ci-placeholder
          QC_ALLOW_INSECURE_BOOTSTRAP=0
          QC_DENY_PUBLIC_TARGETS=1
          QC_SCAN_ALLOWLIST=127.0.0.0/8
          EOF
          docker compose --env-file .env.edge -f deploy/edge/docker-compose.edge.yml config > /tmp/edge-compose.yml
          if grep -Eq '^[[:space:]]+ports:' /tmp/edge-compose.yml; then
            echo "Sovereign Edge must not publish host ports" >&2
            exit 1
          fi

      - name: Generate ephemeral Valkey mTLS PKI
        run: |
          sudo install -d -m 0750 -o root -g root "${RUNNER_TEMP}/qc-edge"
          sudo install -d -m 0750 -o 10001 -g 10001 "${RUNNER_TEMP}/qc-edge/valkey"
          sudo env QC_EDGE_STATE_ROOT="${RUNNER_TEMP}/qc-edge" bash scripts/edge/generate-valkey-mtls.sh

      - name: Prove TLS-only mTLS Valkey
        run: |
          set -euo pipefail
          docker compose --env-file .env.edge -f deploy/edge/docker-compose.edge.yml up -d valkey
          cleanup() { docker compose --env-file .env.edge -f deploy/edge/docker-compose.edge.yml down -v || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' queen-califia-valkey 2>/dev/null || true)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' queen-califia-valkey)" = healthy
          docker exec queen-califia-valkey valkey-cli --tls \
            --cacert /run/valkey-pki/ca.crt \
            --cert /run/valkey-pki/health.crt \
            --key /run/valkey-pki/health.key \
            -h valkey -p 6379 ping | grep -qx PONG
          if docker exec queen-califia-valkey valkey-cli -h valkey -p 6379 ping; then
            echo "plaintext Valkey unexpectedly succeeded" >&2
            exit 1
          fi
          test -s "${RUNNER_TEMP}/qc-edge/valkey/appendonlydir/appendonly.aof.manifest" || {
            docker exec queen-califia-valkey sh -c 'find /data -maxdepth 3 -type f -print'
            echo "Valkey AOF manifest not created" >&2
            exit 1
          }
