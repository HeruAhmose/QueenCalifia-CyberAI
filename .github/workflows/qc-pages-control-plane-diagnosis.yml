name: QC Pages Control Plane Diagnosis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect publish workflow runs on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/publish-dashboard-pages.yml/runs?branch=main&event=push&per_page=10"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > /tmp/runs.json

          echo '=== LATEST PUBLISH RUNS ==='
          jq -r '.workflow_runs[] | [.id,.head_sha,.event,.status,(.conclusion // "null"),.created_at,.html_url] | @tsv' /tmp/runs.json

          count="$(jq '.workflow_runs | length' /tmp/runs.json)"
          echo "QC_PAGES_PUBLISH_RUN_COUNT=$count"
          test "$count" -gt 0

          latest_id="$(jq -r '.workflow_runs[0].id' /tmp/runs.json)"
          latest_sha="$(jq -r '.workflow_runs[0].head_sha' /tmp/runs.json)"
          latest_status="$(jq -r '.workflow_runs[0].status' /tmp/runs.json)"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // "null"' /tmp/runs.json)"
          echo "QC_PAGES_LATEST_RUN_ID=$latest_id"
          echo "QC_PAGES_LATEST_SHA=$latest_sha"
          echo "QC_PAGES_LATEST_STATUS=$latest_status"
          echo "QC_PAGES_LATEST_CONCLUSION=$latest_conclusion"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/runs/${latest_id}/jobs?per_page=100" > /tmp/jobs.json

          echo '=== LATEST PUBLISH JOBS ==='
          jq -r '.jobs[] | [.id,.name,.status,(.conclusion // "null"),.started_at,(.completed_at // "null")] | @tsv' /tmp/jobs.json

          echo '=== LATEST JOB STEPS ==='
          jq -r '.jobs[] | "JOB=" + .name, (.steps[]? | [.number,.name,.status,(.conclusion // "null")] | @tsv)' /tmp/jobs.json
