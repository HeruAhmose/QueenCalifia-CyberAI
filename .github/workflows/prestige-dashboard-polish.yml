name: prestige-dashboard-polish
on:
  push:
    branches: [feat/prestige-sovereign-ui-20260823]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-sovereign-ui-20260823
      - name: Apply restrained sovereign panel grammar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/QueenCalifia_Unified_Command_Dashboard.jsx')
          s=p.read_text(encoding='utf-8')
          replacements={
            'void: "#020409"':'void: "#010307"',
            'bg: "#060a14"':'bg: "#04070c"',
            'panel: "#0a0f1e"':'panel: "#070c14"',
            'panelHover: "#0e1528"':'panelHover: "#0b1320"',
            'surface: "#111b2e"':'surface: "#0c1624"',
            'border: "#131d33"':'border: "#182433"',
            'borderLit: "#1a2d50"':'borderLit: "#294359"',
            'accent: "#2563eb"':'accent: "#d4af37"',
            'accentBright: "#60a5fa"':'accentBright: "#7dd3fc"',
            'borderRadius: 8, overflow: "hidden",':'borderRadius: 14, overflow: "hidden",',
            'padding: "10px 16px", borderBottom: `1px solid ${C.border}`,':'padding: "12px 16px", borderBottom: `1px solid ${C.border}`,',
            'background: C.panel, border: `1px solid ${C.border}`,':'background: `linear-gradient(145deg, ${C.panel}, ${C.void})`, border: `1px solid ${C.border}`,',
            'boxShadow: glow ? `0 0 30px ${accent}08, inset 0 1px 0 ${accent}10` : `inset 0 1px 0 ${C.borderLit}20`,':'boxShadow: glow ? `0 24px 70px rgba(0,0,0,.24), 0 0 42px ${accent}0b, inset 0 1px 0 ${accent}12` : `0 16px 46px rgba(0,0,0,.16), inset 0 1px 0 ${C.borderLit}24`,',
          }
          for old,new in replacements.items():
            assert old in s, old
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('QC_PRESTIGE_PANEL_GRAMMAR=PASS')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --ignore-scripts
      - run: cd frontend && npx prettier --write src/App.jsx src/components/SovereignAwakening.jsx src/components/SovereignCommandFrame.jsx src/QueenCalifia_Unified_Command_Dashboard.jsx
      - run: cd frontend && npm run build
      - name: Commit polished source
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx frontend/src/components/SovereignAwakening.jsx frontend/src/components/SovereignCommandFrame.jsx frontend/src/QueenCalifia_Unified_Command_Dashboard.jsx
          git commit -m 'feat(prestige): refine sovereign command visual grammar'
          git push origin HEAD:feat/prestige-sovereign-ui-20260823
