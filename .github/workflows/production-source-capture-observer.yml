name: production-source-capture-observer

on:
  push:
    branches:
      - ops/production-source-capture-observe
    paths:
      - .ops/production-source-capture-observe.request

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: production-source-capture-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      QC_NAMESPACE: queen-califia-production
      QC_EXPECTED_CAPTURE_SHA: e571d07ea3d0310b8884c7fa0fab00e41dfb513d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read pinned kubectl version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^KUBECTL_VERSION=' scripts/bootstrap/versions.env | cut -d= -f2-)"
          test -n "$version"
          echo "kubectl=$version" >> "$GITHUB_OUTPUT"

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: ${{ steps.versions.outputs.kubectl }}

      - name: Resolve successful capture run and download secret-free evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-source-capture.yml/runs?branch=ops%2Fproduction-live-scanner-capture&event=push&status=completed&per_page=20")"
          run_id="$(printf '%s' "$response" | jq -r --arg sha "$QC_EXPECTED_CAPTURE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
          test -n "$run_id"
          mkdir -p /tmp/qc-capture-evidence
          gh run download "$run_id" -n production-source-capture-evidence -D /tmp/qc-capture-evidence
          test -s /tmp/qc-capture-evidence/production-source-capture.json
          echo "QC_CAPTURE_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Validate capture evidence shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('/tmp/qc-capture-evidence/production-source-capture.json')
          e=json.loads(p.read_text())
          assert e['kind']=='queen-califia-production-source-capture'
          assert e['version']==1 and e['environment']=='production'
          assert e['namespace']=='queen-califia-production'
          assert e['captured_before_pod_replacement'] is True
          assert e['pod_restarted_or_replaced_during_capture'] is False
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', e['api_image_digest'])
          sqlite={x['name']:x for x in e['sqlite_sources']}
          files={x['name']:x for x in e['file_sources']}
          assert set(sqlite)=={'primary-runtime-db','evolution-db','threat-intelligence-db','live-scanner-db'}
          assert set(files)=={'api-keys','audit-log','spki'}
          for item in [*sqlite.values(),*files.values()]:
              assert item['status'] in {'captured','verified-absent'}
              if item['status']=='captured':
                  assert isinstance(item['bytes'],int) and item['bytes']>=0
                  assert re.fullmatch(r'[0-9a-f]{64}',item['sha256'])
              else:
                  assert item.get('checked') is True
          PY

      - name: Configure production kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KUBECONFIG_B64:-}"
          install -d -m 700 ~/.kube
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl auth can-i get pods -n "$QC_NAMESPACE" | grep -qx yes
          kubectl auth can-i create pods/exec -n "$QC_NAMESPACE" | grep -qx yes

      - name: Prove source pod identity still matches capture and snapshot hashes persist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/qc-observer-env
          import json
          e=json.load(open('/tmp/qc-capture-evidence/production-source-capture.json'))
          for key,value in (
              ('QC_SOURCE_POD',e['api_pod']),
              ('QC_SOURCE_UID',e['api_pod_uid']),
              ('QC_SOURCE_IMAGE',e['api_image_digest']),
              ('QC_SOURCE_RESTARTS',str(e['restart_count'])),
          ):
              print(f'{key}={value}')
          PY
          set -a
          . /tmp/qc-observer-env
          set +a
          uid="$(kubectl -n "$QC_NAMESPACE" get pod "$QC_SOURCE_POD" -o jsonpath='{.metadata.uid}')"
          image_id="$(kubectl -n "$QC_NAMESPACE" get pod "$QC_SOURCE_POD" -o jsonpath='{.status.containerStatuses[?(@.name=="api")].imageID}')"
          restarts="$(kubectl -n "$QC_NAMESPACE" get pod "$QC_SOURCE_POD" -o jsonpath='{.status.containerStatuses[?(@.name=="api")].restartCount}')"
          test "$uid" = "$QC_SOURCE_UID"
          case "$image_id" in *"$QC_SOURCE_IMAGE"*) ;; *) echo 'source pod image changed after capture' >&2; exit 1;; esac
          test "$restarts" = "$QC_SOURCE_RESTARTS"

          kubectl -n "$QC_NAMESPACE" exec -i "$QC_SOURCE_POD" -c api -- python - <<'PY' \
            < <(cat /tmp/qc-capture-evidence/production-source-capture.json)
          PY

      - name: Verify persistent SQLite snapshot digests
        shell: bash
        run: |
          set -euo pipefail
          pod="$(python -c "import json; print(json.load(open('/tmp/qc-capture-evidence/production-source-capture.json'))['api_pod'])")"
          evidence_b64="$(base64 -w0 /tmp/qc-capture-evidence/production-source-capture.json)"
          kubectl -n "$QC_NAMESPACE" exec "$pod" -c api -- env QC_EVIDENCE_B64="$evidence_b64" python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          e=json.loads(base64.b64decode(os.environ['QC_EVIDENCE_B64']))
          paths={
              'primary-runtime-db':'/var/data/qc-cutover-20260818-primary.db',
              'evolution-db':'/var/data/qc-cutover-20260818-evolution.db',
              'threat-intelligence-db':'/var/data/qc-cutover-20260818-threat-intel.db',
              'live-scanner-db':'/var/data/qc-cutover-20260818-live-scanner.db',
          }
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          for item in e['sqlite_sources']:
              p=Path(paths[item['name']])
              if item['status']=='captured':
                  if not p.is_file() or p.is_symlink():
                      raise SystemExit(f"snapshot missing/non-regular: {item['name']}")
                  if p.stat().st_size != item['bytes'] or digest(p) != item['sha256']:
                      raise SystemExit(f"snapshot digest mismatch: {item['name']}")
              elif p.exists():
                  raise SystemExit(f"absent source unexpectedly has snapshot: {item['name']}")
          PY

      - name: Publish secret-free immutable checkpoint to issue 72
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/qc-capture-comment.md
          import hashlib, json, os
          raw=open('/tmp/qc-capture-evidence/production-source-capture.json','rb').read()
          e=json.loads(raw)
          print('### Production source capture checkpoint')
          print()
          print(f"- capture workflow run: `{os.environ['QC_CAPTURE_RUN_ID']}`")
          print(f"- capture trigger SHA: `{os.environ['QC_EXPECTED_CAPTURE_SHA']}`")
          print(f"- source pod UID: `{e['api_pod_uid']}`")
          print(f"- immutable API image: `{e['api_image_digest']}`")
          print(f"- evidence JSON SHA-256: `{hashlib.sha256(raw).hexdigest()}`")
          print('- pod replacement/restart during capture: **no**')
          print('- snapshot location: existing API PVC `/var/data` (retained)')
          print()
          print('SQLite sources:')
          for x in e['sqlite_sources']:
              if x['status']=='captured':
                  print(f"- `{x['name']}`: captured, bytes={x['bytes']}, sha256=`{x['sha256']}`")
              else:
                  print(f"- `{x['name']}`: **verified absent**")
          print()
          print('File-backed sources:')
          for x in e['file_sources']:
              if x['status']=='captured':
                  print(f"- `{x['name']}`: fingerprinted in place, bytes={x['bytes']}, sha256=`{x['sha256']}`")
              else:
                  print(f"- `{x['name']}`: **verified absent**")
          print()
          print('This checkpoint proves source capture only. PostgreSQL migration/disposition, production backup→restore, authority cutover/probes, PVC removal, read-only rootfs, rolling validation, and HA remain **not authorized**.')
          PY
          gh issue comment 72 --repo "$GITHUB_REPOSITORY" --body-file /tmp/qc-capture-comment.md

      - name: Remove kubeconfig
        if: always()
        shell: bash
        run: rm -f ~/.kube/config
