name: platform-version-materialize

on:
  push:
    branches:
      - security/platform-toolchain-integrity-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/platform-toolchain-integrity-20260817

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.14.4

      - name: Resolve current chart pins
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null
          chmod +x scripts/bootstrap/bump_versions.sh
          scripts/bootstrap/bump_versions.sh scripts/bootstrap/versions.env
          if grep -Eq '^[A-Z0-9_]+=$' scripts/bootstrap/versions.env; then
            echo "::error::empty platform version remains"
            exit 1
          fi

      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Heru_Ahmose"
          git config user.email "aitconsult22@gmail.com"
          git add scripts/bootstrap/versions.env
          if git diff --cached --quiet; then
            echo "version manifest already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(platform): materialize pinned chart versions"
          git push origin HEAD:security/platform-toolchain-integrity-20260817
