name: Deploy VM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or tag)"
        required: true
        default: "main"
      acme:
        description: "Use Let's Encrypt (acme profile)"
        type: boolean
        required: true
        default: true
      ssh_port:
        description: "SSH port"
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - name: Write SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ~/.ssh/id_ed25519
          DEPLOY_SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_REF: ${{ inputs.ref }}
          QC_ACME: ${{ inputs.acme && '1' || '0' }}
          QC_DOMAIN: ${{ secrets.QC_DOMAIN }}
          QC_EMAIL: ${{ secrets.QC_EMAIL }}
          QC_API_KEY_PEPPER: ${{ secrets.QC_API_KEY_PEPPER }}
          QC_AUDIT_HMAC_KEY: ${{ secrets.QC_AUDIT_HMAC_KEY }}
          QC_CORS_ORIGINS: ${{ secrets.QC_CORS_ORIGINS }}
          QC_PROXY_TRUSTED_HOPS: ${{ secrets.QC_PROXY_TRUSTED_HOPS }}
        run: |
          set -euo pipefail
          bash scripts/deploy/vm_deploy.sh

      - name: Remove SSH key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ~/.ssh/id_ed25519

      - name: Summary
        if: always()
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          QC_ACME: ${{ inputs.acme && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          printf "Deployed ref '%s' to '%s' (acme='%s')\n" "$DEPLOY_REF" "$DEPLOY_HOST" "$QC_ACME" >> "$GITHUB_STEP_SUMMARY"
