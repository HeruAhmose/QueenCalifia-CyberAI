name: QC React Lock Sync Evidence

on:
  push:
    branches: [fix/qc-react-runtime-pages-assets-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate lockfile with npm
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show exact package-lock change
        shell: bash
        run: |
          set -euo pipefail
          echo '=== QC_REACT_LOCK_DIFF_BEGIN ==='
          git diff -- frontend/package-lock.json
          echo '=== QC_REACT_LOCK_DIFF_END ==='
          grep -A12 '"node_modules/react-dom"' frontend/package-lock.json | head -n 14
