name: QC Pages Post-Enable Certification

on:
  push:
    branches: [probe/qc-pages-post-enable-cert-20260823]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect latest dashboard publisher runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-dashboard-pages.yml/runs?per_page=5"
          runs="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          echo 'QC_PUBLISHER_RECENT_RUNS'
          printf '%s' "$runs" | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_branch,head_sha,created_at,updated_at,html_url}'
          latest_id="$(printf '%s' "$runs" | jq -r '.workflow_runs[0].id // empty')"
          if [ -z "$latest_id" ]; then
            echo 'QC_PUBLISHER_RUN=NONE'
            exit 0
          fi
          jobs="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${latest_id}/jobs?per_page=100")"
          echo "QC_PUBLISHER_LATEST_RUN_ID=${latest_id}"
          echo 'QC_PUBLISHER_LATEST_JOBS'
          printf '%s' "$jobs" | jq -c '.jobs[] | {id,name,status,conclusion,steps:[.steps[]? | {name,status,conclusion}]}'

  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Certify exact deployed revision and sovereign UI
        shell: bash
        env:
          EXPECTED_SHA: 31d2c6e8d521c63dbe60dec54bb2c28678a36e03
          BASE_URL: https://heruahmose.github.io/QueenCalifia-CyberAI/
        run: |
          set -euo pipefail
          observed=''
          for i in $(seq 1 50); do
            observed="$(curl -fsSL "${BASE_URL}deploy-commit.txt" 2>/dev/null | tr -d '\r\n' || true)"
            echo "attempt=$i observed=$observed"
            [ "$observed" = "$EXPECTED_SHA" ] && break
            sleep 6
          done
          echo "QC_PUBLIC_EXPECTED_SHA=$EXPECTED_SHA"
          echo "QC_PUBLIC_OBSERVED_SHA=$observed"
          test "$observed" = "$EXPECTED_SHA"

          html="$(curl -fsSL "$BASE_URL")"
          asset="$(printf '%s' "$html" | grep -oE '/QueenCalifia-CyberAI/assets/index-[A-Za-z0-9_-]+\.js' | head -n1)"
          test -n "$asset"
          curl -fsSL "https://heruahmose.github.io${asset}" > /tmp/qc-live.js
          grep -Fq 'qc.tamerian-materials.com' /tmp/qc-live.js

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          timeout 70s "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "$BASE_URL" > /tmp/qc-live.html
          grep -Fqi 'Queen Califia' /tmp/qc-live.html
          grep -Fqi 'SOVEREIGN COGNITIVE DEFENSE' /tmp/qc-live.html
          grep -Fqi 'HUMAN AUTHORITY' /tmp/qc-live.html

          echo 'QC_PUBLIC_EXACT_SHA=PASS'
          echo 'QC_PUBLIC_CANONICAL_API_BINDING=PASS'
          echo 'QC_PUBLIC_PRESTIGE_BROWSER=PASS'
