name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queen
          POSTGRES_PASSWORD: queen-ci
          POSTGRES_DB: queen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queen -d queen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Workflow shell-context guard
        run: python scripts/ci/check_workflow_contexts.py

      - name: Platform toolchain integrity guard
        run: python scripts/ci/check_platform_toolchain.py

      - name: Container and Kubernetes runtime isolation guard
        run: python scripts/ci/check_runtime_isolation.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../scripts/bootstrap/requirements.txt pytest

      - name: PostgreSQL runtime-state contracts
        env:
          QC_TEST_POSTGRES_URL: postgresql://queen:queen-ci@127.0.0.1:5432/queen_ci
        run: |
          python -m pytest -q \
            tests/test_primary_database_contract.py \
            tests/test_sovereignty_postgres_state.py \
            tests/test_security_engine_postgres_state.py \
            tests/test_runtime_state_migration.py \
            tests/test_externalized_scanner_state.py \
            tests/test_externalized_gateway_artifacts.py \
            tests/test_legacy_state_disposition.py

      - name: PostgreSQL backup and restore contract
        env:
          QC_TEST_POSTGRES_URL: postgresql://queen:queen-ci@127.0.0.1:5432/queen_ci
        run: bash scripts/ci/verify_postgres_backup_restore.sh

      - name: Production immutable image promotion guard
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        run: python scripts/ci/check_production_image_promotion.py

      - name: Python syntax check
        working-directory: backend
        run: |
          python -c "
          import ast, os
          ok = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      with open(p) as fh:
                          ast.parse(fh.read(), p)
                      ok += 1
          print(f'{ok} Python files — all clean')
          "

      - name: Flask app boots
        working-directory: backend
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from app import app
          rules = [r.rule for r in app.url_map.iter_rules() if r.rule != '/static/<path:filename>']
          critical = ['/healthz', '/api/vulns/scan', '/api/v1/evolution/status']
          missing = [r for r in critical if r not in rules]
          print(f'{len(rules)} routes registered')
          assert not missing, f'Missing critical routes: {missing}'
          print('App boots successfully.')
          "

      - name: CORS origin policy smoke
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from app import app

          client = app.test_client()
          approved = "http://localhost:5173"
          denied = "https://untrusted.example"

          approved_response = client.get("/api/config", headers={"Origin": approved})
          assert approved_response.status_code == 200, approved_response.status_code
          assert approved_response.headers.get("Access-Control-Allow-Origin") == approved, approved_response.headers
          assert approved_response.headers.get("Access-Control-Allow-Credentials") is None, approved_response.headers

          denied_response = client.get("/api/config", headers={"Origin": denied})
          assert denied_response.status_code == 200, denied_response.status_code
          assert denied_response.headers.get("Access-Control-Allow-Origin") is None, denied_response.headers

          print("CORS allowlist policy verified for approved and unapproved origins.")
          PY

      - name: Production Gunicorn runtime smoke
        working-directory: backend
        run: |
          set -euo pipefail
          gunicorn --version | tee /tmp/qc-gunicorn.version
          grep -Eq 'gunicorn \(version 26\.0\.0\)|gunicorn 26\.0\.0' /tmp/qc-gunicorn.version
          gunicorn app:app \
            --bind 127.0.0.1:18000 \
            --workers 1 \
            --threads 2 \
            --timeout 30 \
            --keep-alive 5 \
            --graceful-timeout 10 \
            >/tmp/qc-gunicorn.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/qc-gunicorn.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/qc-gunicorn.log
            echo "Gunicorn did not become healthy" >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            http://127.0.0.1:18000/healthz \
            --output /tmp/qc-health.body
          test -s /tmp/qc-health.body

          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT

      - name: Backend pytest
        working-directory: .
        run: |
          python -m pytest -q

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  docker-prod-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compose config (requires .env for env_file)
        run: |
          printf '%s\n' 'QC_API_KEY_PEPPER=ci-not-a-secret' 'QC_AUDIT_HMAC_KEY=ci-not-a-secret' > .env
          docker compose -f docker-compose.prod.yml config >/dev/null
          echo "docker-compose.prod.yml OK"

      - name: Build dashboard Docker image (nginx + Vite, VITE_SAME_ORIGIN_API)
        run: |
          docker build -f frontend/Dockerfile ./frontend \
            --build-arg VITE_SAME_ORIGIN_API=1 \
            --build-arg VITE_API_URL= \
            --build-arg VITE_QC_API_URL= \
            -t qc-dashboard:ci

  argocd-health:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    needs: [backend-check, frontend-check, docker-prod-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install verified argocd CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^ARGOCD_CLI_VERSION=' scripts/bootstrap/versions.env | cut -d= -f2-)"
          expected_sha="$(grep '^ARGOCD_CLI_SHA256=' scripts/bootstrap/versions.env | cut -d= -f2-)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${version}/argocd-linux-amd64"
          printf '%s  %s\n' "$expected_sha" argocd | sha256sum --check --strict -
          chmod 0755 argocd
          sudo install -m 0755 argocd /usr/local/bin/argocd
          rm -f argocd
          argocd version --client

      - name: Gate merge if production is degraded
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: ${{ secrets.ARGOCD_OPTS }}
          APP_PRODUCTION: ${{ vars.ARGOCD_APP_PRODUCTION || 'queen-califia-production' }}
        run: |
          set -euo pipefail
          test -n "$ARGOCD_SERVER"
          test -n "$ARGOCD_AUTH_TOKEN"
          OPTS="${ARGOCD_OPTS:-}"
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null
          status="$(argocd app get "$APP_PRODUCTION" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" $OPTS -o json \
            | jq -r '.status.health.status + "/" + .status.sync.status')"
          echo "$APP_PRODUCTION => $status"
          test "$status" = "Healthy/Synced"
