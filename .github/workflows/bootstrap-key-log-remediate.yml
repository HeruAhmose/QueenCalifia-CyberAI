name: bootstrap-key-log-remediate

on:
  push:
    branches:
      - agent/redact-bootstrap-api-keys-20260816

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bootstrap secret handling remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/gateway.py')
          text = path.read_text(encoding='utf-8')

          old = '''        # Dev bootstrap (writes keys.json)
        admin = self.generate_key(role="admin", permissions=["read", "write", "execute", "admin"], rate_limit=240, description="bootstrap admin key")
        analyst = self.generate_key(role="analyst", permissions=["read", "write", "execute"], rate_limit=120, description="bootstrap analyst key")
        reader = self.generate_key(role="reader", permissions=["read"], rate_limit=60, description="bootstrap reader key")
        self._persist()
        logger.warning("🔑 Bootstrapped API keys (store securely; rotate immediately):")
        logger.warning("   ADMIN  = %s", admin)
        logger.warning("   ANALYST= %s", analyst)
        logger.warning("   READER = %s", reader)
'''

          new = '''        # Dev bootstrap. Raw credentials are never emitted to application logs.
        admin = self.generate_key(role="admin", permissions=["read", "write", "execute", "admin"], rate_limit=240, description="bootstrap admin key")
        analyst = self.generate_key(role="analyst", permissions=["read", "write", "execute"], rate_limit=120, description="bootstrap analyst key")
        reader = self.generate_key(role="reader", permissions=["read"], rate_limit=60, description="bootstrap reader key")
        bootstrap_path = (os.environ.get("QC_BOOTSTRAP_KEYS_FILE", "") or "").strip()
        if not bootstrap_path:
            bootstrap_path = self.file_path + ".bootstrap.json"
        self._persist_bootstrap_secrets(
            bootstrap_path,
            {"admin": admin, "analyst": analyst, "reader": reader},
        )
        try:
            self._persist()
        except Exception:
            try:
                os.unlink(bootstrap_path)
            except OSError:
                pass
            raise
        logger.warning(
            "Bootstrapped API keys written to owner-only file %s; "
            "move them to a secret manager and delete the bootstrap file after capture.",
            bootstrap_path,
        )
'''

          if old not in text:
              raise SystemExit('Expected bootstrap logging block not found; refusing non-deterministic patch')
          text = text.replace(old, new, 1)

          marker = '''    def _hash_key(self, key: str) -> str:\n        return api_key_fingerprint(key, self.pepper)\n'''
          helper = '''    def _persist_bootstrap_secrets(self, file_path: str, keys: Dict[str, str]) -> None:
        """Write one-time bootstrap credentials without exposing them to logs."""
        directory = os.path.dirname(file_path) or "."
        os.makedirs(directory, exist_ok=True)
        payload = {
            "created_at": _utcnow(),
            "warning": "Move these credentials to a secret manager, then delete this file.",
            "keys": dict(keys),
        }
        flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
        try:
            fd = os.open(file_path, flags, 0o600)
        except FileExistsError as exc:
            raise RuntimeError(
                f"Bootstrap credential file already exists: {file_path}. "
                "Refusing to overwrite existing secrets."
            ) from exc
        try:
            with os.fdopen(fd, "w", encoding="utf-8") as f:
                json.dump(payload, f, indent=2, sort_keys=True)
                f.write("\\n")
                f.flush()
                try:
                    os.fsync(f.fileno())
                except OSError:
                    pass
            try:
                os.chmod(file_path, 0o600)
            except OSError:
                pass
        except Exception:
            try:
                os.unlink(file_path)
            except OSError:
                pass
            raise

'''
          if marker not in text:
              raise SystemExit('Expected _hash_key marker not found; refusing non-deterministic patch')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')

          ignore = Path('.gitignore')
          ignore_text = ignore.read_text(encoding='utf-8')
          pattern = '*.bootstrap.json'
          if pattern not in ignore_text.splitlines():
              ignore_text = ignore_text.rstrip() + '\n' + pattern + '\n'
              ignore.write_text(ignore_text, encoding='utf-8')
          PY

          cat > tests/test_api_key_bootstrap_secrets.py <<'PYTEST'
          import json
          import logging
          import os
          import stat

          from api.gateway import APIKeyStore


          def test_dev_bootstrap_never_logs_raw_keys(tmp_path, monkeypatch, caplog):
              key_store = tmp_path / "keys.json"
              bootstrap_file = tmp_path / "bootstrap-secrets.json"
              monkeypatch.delenv("QC_API_KEYS_JSON", raising=False)
              monkeypatch.delenv("QC_API_KEY", raising=False)
              monkeypatch.delenv("QC_ADMIN_KEY", raising=False)
              monkeypatch.delenv("QC_PRODUCTION", raising=False)
              monkeypatch.setenv("QC_BOOTSTRAP_KEYS_FILE", str(bootstrap_file))

              with caplog.at_level(logging.WARNING, logger="queencalifia.api"):
                  store = APIKeyStore(str(key_store), "test-pepper")

              payload = json.loads(bootstrap_file.read_text(encoding="utf-8"))
              raw_keys = list(payload["keys"].values())
              assert len(raw_keys) == 3
              assert all(len(value) == 64 for value in raw_keys)
              assert all(store.validate(value) is not None for value in raw_keys)
              assert all(value not in caplog.text for value in raw_keys)
              assert str(bootstrap_file) in caplog.text
              assert stat.S_IMODE(os.stat(bootstrap_file).st_mode) == 0o600

              persisted = json.loads(key_store.read_text(encoding="utf-8"))
              persisted_text = json.dumps(persisted)
              assert all(value not in persisted_text for value in raw_keys)


          def test_bootstrap_refuses_to_overwrite_existing_secret_file(tmp_path, monkeypatch):
              key_store = tmp_path / "keys.json"
              bootstrap_file = tmp_path / "bootstrap-secrets.json"
              bootstrap_file.write_text("do-not-overwrite", encoding="utf-8")
              monkeypatch.delenv("QC_API_KEYS_JSON", raising=False)
              monkeypatch.delenv("QC_API_KEY", raising=False)
              monkeypatch.delenv("QC_ADMIN_KEY", raising=False)
              monkeypatch.delenv("QC_PRODUCTION", raising=False)
              monkeypatch.setenv("QC_BOOTSTRAP_KEYS_FILE", str(bootstrap_file))

              try:
                  APIKeyStore(str(key_store), "test-pepper")
              except RuntimeError as exc:
                  assert "Refusing to overwrite existing secrets" in str(exc)
              else:
                  raise AssertionError("Expected bootstrap overwrite protection to fail closed")

              assert bootstrap_file.read_text(encoding="utf-8") == "do-not-overwrite"
              assert not key_store.exists()
          PYTEST

      - name: Verify security behavior and full repository suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m compileall -q api backend core tests
          python -m pytest -q tests/test_api_key_bootstrap_secrets.py
          python -m pytest -q

      - name: Prove raw bootstrap values are not logged
        shell: bash
        run: |
          if grep -nE 'logger\.(warning|info|error|debug)\([^\n]*(admin|analyst|reader)' api/gateway.py; then
            echo "Potential raw bootstrap credential logging remains" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('api/gateway.py').read_text(encoding='utf-8')
          forbidden = [
              'ADMIN  = %s',
              'ANALYST= %s',
              'READER = %s',
              'Bootstrapped API keys (store securely; rotate immediately):',
          ]
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'Forbidden raw-key logging strings remain: {present}')
          PY

      - name: Commit verified remediation
        shell: bash
        run: |
          git diff -- api/gateway.py tests/test_api_key_bootstrap_secrets.py .gitignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/gateway.py tests/test_api_key_bootstrap_secrets.py .gitignore
          if git diff --cached --quiet; then
            echo "No remediation changes to commit" >&2
            exit 1
          fi
          git commit -m "fix(security): stop logging bootstrap API keys"
          git push origin HEAD:agent/redact-bootstrap-api-keys-20260816
